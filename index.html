<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#f8fafc">
    <title>Dots and Boxes</title>
    <link rel="stylesheet" href="index.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script type="module" src="app.js"></script>
</head>
<body>
    <header><nav></nav></header>
    <main>
        <section><canvas id="board"></canvas></section>
        <aside id="controls">
            <!-- Box 1 (right): scores -->
            <div class="panel-box score-box">
            <div class="score-board" aria-label="Player Scores">
                <div class="score-side active" id="p1Card">
                <span class="score-name">Player 1</span>
                <output id="player1Score">0</output>
                <span class="thinking-icon" aria-hidden="true"><svg viewBox="0 0 64 64"><g class="hourglass"><rect x="13" y="7" width="38" height="6" rx="3"/><rect x="13" y="51" width="38" height="6" rx="3"/><path d="M20 13 H44 L34.5 29 V35 L44 51 H20 L29.5 35 V29 Z"/></g></svg></span>
                </div>
                <div class="score-side" id="p2Card">
                <span class="score-name">Player 2</span>
                <output id="player2Score">0</output>
                <span class="thinking-icon" aria-hidden="true"><svg viewBox="0 0 64 64"><g class="hourglass"><rect x="13" y="7" width="38" height="6" rx="3"/><rect x="13" y="51" width="38" height="6" rx="3"/><path d="M20 13 H44 L34.5 29 V35 L44 51 H20 L29.5 35 V29 Z"/></g></svg></span>
                </div>
            </div>
            </div>

            <!-- Box 2 (right): player types + board setup -->
            <div class="panel-box setup-box">
            <div class="player-toggles">
                <div class="player-col">
                    <select id="player1Type" class="toggle-select" aria-label="Player 1 type">
                        <option value="human" selected>Human</option>
                        <option value="ai-beginner">AI (beginner)</option>
                        <option value="ai-intermediate">AI (intermediate)</option>
                        <option value="ai-advanced">AI (advanced)</option>
                    </select>
                </div>
                <div class="player-col">
                    <select id="player2Type" class="toggle-select" aria-label="Player 2 type">
                        <option value="human">Human</option>
                        <option value="ai-beginner">AI (beginner)</option>
                        <option value="ai-intermediate">AI (intermediate)</option>
                        <option value="ai-advanced" selected>AI (advanced)</option>
                    </select>
                </div>
            </div>

            <!-- 2. Semantic Settings Configuration Group -->
            <fieldset class="settings-group">
                <legend class="visually-hidden">Grid Size Settings</legend>

                <div class="control-group">
                <label for="heightRange">Height</label>
                <input type="range" min="1" max="10" value="3" id="heightRange">
                <output id="heightValue">3</output>
                </div>

                <div class="control-group">
                <label for="widthRange">Width</label>
                <input type="range" min="1" max="10" value="3" id="widthRange">
                <output id="widthValue">3</output>
                </div>

                <input type="button" value="New Game" id="newGameButton">
            </fieldset>
            </div>

            <!-- Box 4 (right): dev test panel, hidden until the Konami code -->
            <div class="panel-box test-box hidden" id="testBox">
                <button class="test-box-close" id="testBoxClose" aria-label="Hide test panel">×</button>
                <div class="control-group">
                <label for="test-select">Test case</label>
                <select id="test-select" class="toggle-select test-select" aria-label="Test case">
                    <option value="1" selected>1: smallest area to give</option>
                    <option value="2">2: smallest area to give (2nd)</option>
                    <option value="3">3: smallest area to give (3rd)</option>
                    <option value="4">4: knowing when to not take a square</option>
                    <option value="5">5: single box vs larger areas</option>
                    <option value="6">6: smallest available area</option>
                    <option value="7">7: don't take squares</option>
                    <option value="8">8: loop leave-4</option>
                    <option value="9">9: chain choice (4-chain)</option>
                    <option value="10">10: double-cross loses (2-chain)</option>
                    <option value="11">11: double-cross loses (2-chain, all loops)</option>
                    <option value="12">12: decline a take (non-decomposed)</option>
                    <option value="13">13: sacrifice a box (E=20)</option>
                    <option value="14">14: lottery pick (E=20)</option>
                    <option value="15">15: double-cross guard (4x4)</option>
                    <option value="16">16: forego a take (E=16)</option>
                    <option value="17">17: open 4-loop trap (decomposed)</option>
                    <option value="18" selected>18: double-cross loses (parity token)</option>
                    <option value="19">19: open the ring (Allcock separator)</option>
                    <option value="20">20: opened chain (deferred double-cross)</option>
                </select>
                </div>
                <div class="control-group">
                <label for="test-ai">TEST PLAYER</label>
                <select id="test-ai" class="toggle-select test-select" aria-label="Test player">
                    <option value="ai-beginner">AI (beginner)</option>
                    <option value="ai-intermediate">AI (intermediate)</option>
                    <option value="ai-advanced" selected>AI (advanced)</option>
                </select>
                </div>
            </div>

            <!-- Box 5 (right): saved-games review (recorded league games);
                 hidden unless the test panel is shown -->
            <div class="panel-box games-box hidden" id="gamesBox">
                <div class="control-group">
                <label for="games-select">Saved game</label>
                <select id="games-select" class="toggle-select test-select" aria-label="Saved game"></select>
                </div>
                <div class="games-nav">
                    <button id="games-prev" class="games-step" aria-label="Previous move">&#9664;</button>
                    <span id="games-counter">Move 0 of 0</span>
                    <button id="games-next" class="games-step" aria-label="Next move">&#9654;</button>
                </div>
                <p id="games-info" class="games-info"></p>
            </div>
        </aside>
    </main>
    <div id="gameOverBanner" class="game-over-banner" role="dialog" aria-live="polite">
        <div class="game-over-card">
            <h2 id="gameOverTitle">Player 1 wins!</h2>
            <p id="gameOverSubtitle">0 – 0</p>
            <button id="okButton">OK</button>
        </div>
    </div>
    <footer></footer>
</body>
</html>
